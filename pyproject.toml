[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-trading-signals"
version = "0.1.0"
description = "Generate structured trading signals from market data using Claude (Anthropic SDK)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Daniel Pena" }]
keywords = ["anthropic", "claude", "trading", "signals", "llm", "quant", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/daperk/claude-trading-signals"
Repository = "https://github.com/daperk/claude-trading-signals"
Issues = "https://github.com/daperk/claude-trading-signals/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_trading_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
